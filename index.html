<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Player</title>
<style>
  /* Colors (taken from the game hub file) */
  :root { --bg: #0b0b10; --panel: #15151d; --border: #2a2a38; --accent: #9300ee; --muted: #aaa; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: #fff; }
  button { font: inherit; color: #fff; cursor: pointer; }
  input[type=range] { accent-color: var(--accent); }
  ul { list-style: none; padding: 0; margin: 0; }

  /* ---------- Icons ---------- */
  button svg { width: 20px; height: 20px; display: block; fill: currentColor; }
  button svg.stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon { background: transparent; border: none; border-radius: 8px; padding: 7px; display: flex; opacity: 0.7; }
  .icon:hover { background: var(--accent); opacity: 1; }
  .icon:disabled { opacity: 0.2; cursor: default; background: transparent; }

  /* ---------- Page layout: sidebar + main ---------- */
  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; padding-bottom: 92px; }
  aside { padding: 24px 14px; border-right: 1px solid var(--border); background: #0e0e14;
          position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; }
  .logo { font-weight: 300; letter-spacing: 4px; color: var(--accent); font-size: 20px; margin: 0 8px 20px; }
  .navitem { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left;
             padding: 9px 12px; margin-bottom: 4px; background: none; border: none; border-radius: 8px; }
  .navitem:hover { background: var(--panel); }
  .navitem[aria-current="true"] { background: var(--accent); }
  .navitem .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .navitem .count { color: var(--muted); }
  .navitem[aria-current="true"] .count { color: #fff; }
  .navitem .eq { margin-right: 8px; vertical-align: middle; }
  .navitem[aria-current="true"] .eq i { background: #fff; }
  .side-h { margin: 20px 4px 6px 12px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  .side-h .icon { padding: 4px; }
  .side-h svg { width: 18px; height: 18px; }
  input[type=text] { flex: 1; min-width: 0; background: var(--panel); color: #fff; border: 1px solid var(--border);
                     border-radius: 8px; padding: 8px 10px; font: inherit; }
  input[type=text]:focus { outline: 2px solid var(--accent); }

  /* ---------- Header banner for the current view ---------- */
  .hero { padding: 36px 32px 26px; background: linear-gradient(135deg, #9300ee 0%, #3a0a66 55%, var(--bg) 100%); }
  .hero h2 { margin: 0; font-size: clamp(30px, 5vw, 52px); font-weight: 300; letter-spacing: 3px; overflow-wrap: anywhere; }
  .hero p { color: #e6d0ff; margin: 6px 0 18px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px;
         background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.25); transition: 0.2s; }
  .btn:hover { background: #fff; color: #0b0b10; }
  .btn.primary { background: #fff; color: #0b0b10; }
  .btn.primary:hover { filter: brightness(0.9); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn:disabled:hover { background: rgba(0,0,0,0.35); color: #fff; }
  .btn svg { width: 18px; height: 18px; }
  .btn.hbtn { padding: 11px; border-radius: 50%; }
  .btn.hbtn svg { width: 20px; height: 20px; }
  .btn.hbtn.big { padding: 18px; }
  .btn.hbtn.big svg { width: 30px; height: 30px; }

  /* ---------- Song rows ---------- */
  .content { padding: 14px 20px 0; }
  .row { display: grid; grid-template-columns: 36px 1fr auto auto; align-items: center; gap: 10px;
         padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  .row:hover { background: var(--panel); }
  .row.current { background: rgba(147, 0, 238, 0.25); }
  .row.current .title { color: #d9a8ff; font-weight: 600; }
  .idx { color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  .title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dur { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .ops { display: flex; align-items: center; gap: 2px; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 2px dashed var(--border);
           border-radius: 14px; margin: 10px 0; }
  body.dragging main { outline: 2px dashed var(--accent); outline-offset: -8px; }

  /* Little animated bars on the song that's playing */
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
  .eq i { width: 3px; background: var(--accent); }
  .eq i:nth-child(1) { height: 40%; } .eq i:nth-child(2) { height: 100%; } .eq i:nth-child(3) { height: 60%; }
  @media (prefers-reduced-motion: no-preference) {
    .is-playing .eq i { animation: bounce 0.9s ease-in-out infinite; }
    .is-playing .eq i:nth-child(2) { animation-delay: 0.2s; }
    .is-playing .eq i:nth-child(3) { animation-delay: 0.4s; }
  }
  @keyframes bounce { 0%, 100% { height: 25%; } 50% { height: 100%; } }

  /* ---------- Bottom bar: left = song name, middle = controls, right = shuffle/queue/volume ---------- */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; gap: 12px;
    padding: 14px 16px 6px; background: var(--panel); border-top: 2px solid var(--accent);
  }
  #now { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: bold; font-size: 14px; }
  #middle { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #seekRow { width: 75%; display: flex; align-items: center; gap: 10px; }
  .seekwrap { flex: 1; min-width: 0; position: relative; display: flex; }
  #seekTip { position: absolute; bottom: 100%; left: 0; transform: translateX(-50%); margin-bottom: 2px;
             background: #fff; color: #0b0b10; font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 6px;
             white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; opacity: 0; transition: opacity 0.1s; }
  #seekTip.show { opacity: 1; }
  #curTime, #durTime { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; width: 36px; }
  #curTime { text-align: right; }
  #durTime { text-align: left; }
  #seek { flex: 1; min-width: 0; -webkit-appearance: none; appearance: none; cursor: pointer; outline: none;
          height: 14px; padding: 5px 0; margin: 0; border-radius: 0; background-clip: content-box;
          background-color: transparent;
          background-image: linear-gradient(to right,
            var(--accent) var(--fill, 0%),
            rgba(147, 0, 238, 0.5) var(--fill, 0%),
            rgba(147, 0, 238, 0.5) var(--hover, var(--fill, 0%)),
            var(--border) var(--hover, var(--fill, 0%))); }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: none; }
  #seek::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: none; }
  #seek:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #buttons { display: flex; gap: 6px; align-items: center; }
  #right { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
  #volume { width: 90px; }
  .ctl { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 5px;
         display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .ctl:hover { background: var(--accent); border-color: var(--accent); }
  .ctl.on { background: var(--accent); border-color: var(--accent); }
  #bar .ctl svg { width: 18px; height: 18px; }
  #play { background: var(--accent); border-color: var(--accent); width: 34px; height: 34px; border-radius: 50%; }
  #bar #play svg { width: 20px; height: 20px; }

  /* ---------- Queue panel (slides in from the right, stops above the bottom bar) ---------- */
  #queue {
    position: fixed; top: 0; right: 0; bottom: 0; width: 320px; max-width: 90vw;
    background: var(--panel); border-left: 2px solid var(--accent); padding: 12px;
    overflow-y: auto; z-index: 10;
    transform: translateX(100%); transition: transform 0.2s;
  }
  #queue.open { transform: translateX(0); }
  #queue h3 { margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  #queue .grp { display: flex; gap: 2px; }
  .qrow { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 6px;
          padding: 3px 4px; border-radius: 8px; cursor: pointer; }
  .qrow:hover { background: var(--bg); }
  .qrow.current { background: rgba(147, 0, 238, 0.25); }
  .qrow .icon { padding: 5px; }
  .qrow svg { width: 16px; height: 16px; }

  /* "Now playing" card at the top of the queue */
  .q-h { color: var(--muted); font-size: 13px; margin: 0 4px 6px; }
  .nowcard { margin-bottom: 24px; padding: 12px; border-radius: 12px; background: rgba(147, 0, 238, 0.25);
             border: 1px solid var(--accent); }
  .nowcard .q-h { margin: 0 0 8px; color: #d9a8ff; }
  .nowrow { display: flex; align-items: center; gap: 10px; font-weight: 600; color: #fff; }
  .nowrow .title { flex: 1; min-width: 0; }

  /* Queue drag and drop */
  .qrow { position: relative; }
  .qrow.dragging { opacity: 0.4; }
  .qrow.drop-before::before, .qrow.drop-after::after {
    content: ''; position: absolute; left: 4px; right: 4px; height: 3px; border-radius: 2px;
    background: var(--accent); pointer-events: none; }
  .qrow.drop-before::before { top: -2px; }
  .qrow.drop-after::after { bottom: -2px; }

  /* Small message that pops up above the bottom bar */
  #toast { position: fixed; left: 50%; transform: translateX(-50%); background: #fff; color: #0b0b10;
           padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 50; opacity: 0;
           pointer-events: none; transition: opacity 0.2s; }
  #toast.show { opacity: 1; }

  /* Popup for naming a playlist */
  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 40; }
  .modal[hidden] { display: none; }
  .dialog { background: var(--panel); border: 1px solid var(--border); border-top: 2px solid var(--accent);
            border-radius: 14px; padding: 20px; width: min(360px, 90vw); }
  .dialog h3 { margin: 0 0 12px; font-weight: 300; letter-spacing: 2px; }
  .dialog input { width: 100%; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  /* Search + sort bar above the song list */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar[hidden] { display: none; }
  .toolbar input[type=text] { min-width: 160px; }
  select { background: var(--panel); color: #fff; border: 1px solid var(--border); border-radius: 8px;
           padding: 8px 10px; font: inherit; cursor: pointer; }
  select:focus { outline: 2px solid var(--accent); }

  /* Add-songs popup */
  .dialog.pick { width: min(520px, 92vw); max-height: 80vh; display: flex; flex-direction: column; }
  .pick-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .dialog .pick-head h3 { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pickList { margin-top: 10px; overflow-y: auto; min-height: 0; flex: 1; }

  /* Rows in the popup: name, length, + button */
  .row.picker { grid-template-columns: 1fr auto auto; cursor: default; }
  .row.picker .icon:disabled { opacity: 1; color: var(--accent); }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); padding: 14px; }
    .logo { margin-bottom: 10px; }
    .hero { padding: 24px 16px 18px; }
    .content { padding: 10px 8px 0; }
    .row { grid-template-columns: 28px 1fr auto; }
    .row.picker { grid-template-columns: 1fr auto; }
    .dur { display: none; }
    #bar { grid-template-columns: 1fr; gap: 4px; }
    #seekRow { width: 92%; }
    #now, #right { justify-content: center; text-align: center; }
  }
</style>
</head>
<body>

<div class="layout">
  <aside>
    <div class="logo"></div>
    <nav id="nav"></nav>
  </aside>

  <main>
    <header class="hero" id="hero"></header>
    <div class="content">
      <div class="toolbar" id="toolbar" hidden>
        <input type="text" id="viewSearch" placeholder="Search songs" aria-label="Search songs">
        <select id="viewSort" aria-label="Sort songs">
          <option value="custom">Original order</option>
          <option value="az">Title: A to Z</option>
          <option value="za">Title: Z to A</option>
          <option value="long">Length: longest first</option>
          <option value="short">Length: shortest first</option>
        </select>
      </div>
      <ul id="list"></ul>
    </div>
  </main>
</div>

<!-- Pick files here (the "Add songs" button opens this) -->
<input type="file" id="files" accept="audio/*" multiple hidden>
<audio id="audio"></audio>
<div id="toast"></div>

<!-- Popup: pick songs to add to the open playlist -->
<div id="pickModal" class="modal" hidden>
  <div class="dialog pick" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
    <div class="pick-head">
      <h3 id="pickTitle">Add to playlist</h3>
      <button class="icon" id="pickClose" title="Close"></button>
    </div>
    <input type="text" id="pickSearch" placeholder="Search your library" aria-label="Search your library">
    <ul id="pickList"></ul>
  </div>
</div>

<!-- Popup: name a new playlist -->
<div id="modal" class="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">New playlist</h3>
    <input type="text" id="plName" placeholder="Playlist name" maxlength="40" aria-label="Playlist name">
    <div class="dlg-actions">
      <button class="btn" id="plCancel">Cancel</button>
      <button class="btn primary" id="plCreate">Create</button>
    </div>
  </div>
</div>

<!-- Queue panel -->
<div id="queue">
  <h3>
    <span id="queueTitle">Queue</span>
    <span class="grp">
      <button class="icon" id="closeQueue" title="Close"></button>
    </span>
  </h3>
  <div id="nowBlock"></div>
  <div class="q-h" id="upHead">Next up</div>
  <ul id="queueList"></ul>
</div>

<!-- Bottom bar -->
<div id="bar">
  <div id="now">Nothing playing</div>

  <div id="middle">
    <div id="seekRow">
      <span id="curTime">0:00</span>
      <div class="seekwrap">
        <input type="range" id="seek" min="0" max="100" step="any" value="0" aria-label="Seek">
        <div id="seekTip">0:00</div>
      </div>
      <span id="durTime">0:00</span>
    </div>
    <div id="buttons">
      <button class="ctl" id="prev" title="Previous"></button>
      <button class="ctl" id="play" title="Play"></button>
      <button class="ctl" id="next" title="Next"></button>
    </div>
  </div>

  <div id="right">
    <button class="ctl" id="shuffle" title="Shuffle"></button>
    <button class="ctl" id="queueBtn" title="Queue"></button>
    <input type="range" id="volume" min="0" max="100" value="100" title="Volume" aria-label="Volume">
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const audio = $('audio');
const seek = $('seek');

// ---------- Icons (inline SVG) ----------
const svg = (inner, stroke) => '<svg viewBox="0 0 24 24"' + (stroke ? ' class="stroke"' : '') + '>' + inner + '</svg>';
const ICONS = {
  prev:    svg('<path d="M6 6h2v12H6zM20 6v12L9.5 12z"/>'),
  next:    svg('<path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/>'),
  play:    svg('<path d="M8 5v14l11-7z"/>'),
  pause:   svg('<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'),
  shuffle: svg('<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>', true),
  queue:   svg('<path d="M3 6h13M3 12h13M3 18h7"/><path d="M16 15v6l5-3z" fill="currentColor"/>', true),
  close:   svg('<path d="M6 6l12 12M18 6 6 18"/>', true),
  plus:    svg('<path d="M12 5v14M5 12h14"/>', true),
  addq:    svg('<path d="M3 6h12M3 12h12M3 18h7M18 13v8M14 17h8"/>', true),
  trash:   svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', true),
  check:   svg('<path d="M5 12l5 5 9-10"/>', true),
  upload:  svg('<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>', true),
};

// Put icons on the buttons that are written in the HTML above
[['prev','prev'], ['play','play'], ['next','next'], ['shuffle','shuffle'], ['queueBtn','queue'],
 ['closeQueue','close'], ['pickClose','close']].forEach(([id, icon]) => {
  const b = $(id);
  b.innerHTML = ICONS[icon];
  b.setAttribute('aria-label', b.title);
});

// ---------- State ----------
let songs = [];          // the library: { id, name, url, dur }
let playlists = [];      // { id, name, ids: [songId, ...] }
let view = 'library';    // what the main page shows: 'library' or a playlist id
let picking = null;      // playlist id while the add-songs popup is open (null = closed)
let queue = [];          // song ids, in the order they will play (you can edit this)
let qpos = -1;           // which spot in the queue is playing now (-1 = nothing yet)
let shuffle = false;
let playingFrom = null;  // which list ('library' or a playlist id) the music was started from
let currentGone = false; // the playing song was taken out of the queue, but is still playing out
let dragFrom = null;      // queue spot being dragged (null = not dragging)
let dropGap = null;      // gap it would drop into (0 = before the first song)
let nextId = 1;          // counter for song and playlist ids
let ready;               // resolves once saved songs have been loaded
let loaded = false;      // true after loading (nothing is saved before that)

// ---------- Small helpers ----------
const byId = (id) => songs.find((s) => s.id === id);
const currentSong = () => (qpos >= 0 ? byId(queue[qpos]) : null);
const fmt = (s) => {
  if (!isFinite(s)) return '';
  s = Math.floor(s);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};
function shuffleArray(a) {          // shuffles in place and returns the array
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function viewIds() {                // song ids shown on the main page
  if (view === 'library') return songs.map((s) => s.id);
  const pl = playlists.find((p) => p.id === view);
  return pl ? pl.ids.filter(byId) : [];
}
// The songs actually shown on the main page: the current view, searched and sorted
function displayIds() {
  let ids = viewIds();
  const q = $('viewSearch').value.trim().toLowerCase();
  if (q) ids = ids.filter((id) => byId(id).name.toLowerCase().includes(q));
  const mode = $('viewSort').value;
  const byName = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base', numeric: true });
  const sorters = {
    az: byName,
    za: (a, b) => byName(b, a),
    long: (a, b) => (b.dur || 0) - (a.dur || 0),
    short: (a, b) => (a.dur || 0) - (b.dur || 0),
  };
  if (sorters[mode]) ids = ids.slice().sort((x, y) => sorters[mode](byId(x), byId(y)));
  return ids;
}
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}
function iconBtn(icon, title, fn) {
  const b = document.createElement('button');
  b.className = 'icon';
  b.innerHTML = ICONS[icon];
  b.title = title;
  b.setAttribute('aria-label', title);
  b.onclick = (e) => { e.stopPropagation(); fn(); };
  return b;
}

// ---------- Saving between visits ----------
// The audio files go in IndexedDB, because localStorage is only about 5 MB and can't hold music.
// Playlists and settings are small, so they go in localStorage.
const STORE_KEY = 'musicPlayer.v1';
let saveWarned = false;
function warnSave() {
  if (saveWarned) return;
  saveWarned = true;
  toast("Couldn't save to this browser, so your songs won't be here next time");
}

let dbPromise;
function openDB() {
  if (!dbPromise) dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('musicPlayer', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('songs', { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
// Run something against the songs store; resolves with the request's result
function dbRun(mode, fn) {
  return openDB().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction('songs', mode);
    const req = fn(tx.objectStore('songs'));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = tx.onabort = () => reject(tx.error);
  }));
}
const dbSave = (rec) => dbRun('readwrite', (st) => st.put(rec)).catch(warnSave);
const dbRemove = (id) => dbRun('readwrite', (st) => st.delete(id)).catch(() => {});

function saveState() {
  if (!loaded) return;                  // never overwrite saved data before it has been read
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      playlists, nextId, shuffle, volume: Math.round(audio.volume * 100),
    }));
  } catch (e) { warnSave(); }
}

async function loadSaved() {
  let state = {};
  try { state = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { /* nothing saved yet */ }
  playlists = Array.isArray(state.playlists) ? state.playlists : [];
  nextId = state.nextId || 1;
  if (typeof state.volume === 'number') {
    $('volume').value = state.volume;
    audio.volume = state.volume / 100;
  }
  setShuffle(!!state.shuffle);
  try {
    const recs = await dbRun('readonly', (st) => st.getAll());
    (recs || []).filter((r) => r && r.blob).sort((a, b) => a.id - b.id).forEach((r) => {
      songs.push(makeSong(r.id, r.name, r.blob));
      nextId = Math.max(nextId, r.id + 1);
    });
  } catch (e) { /* storage unavailable: start with an empty library */ }
  playlists.forEach((p) => { p.ids = (p.ids || []).filter(byId); });   // forget songs that are gone
  loaded = true;
  renderAll();
}

// ---------- Importing songs ----------
function makeSong(id, name, blob) {
  const song = { id, name, url: URL.createObjectURL(blob), dur: 0 };
  // read the length of the song so it can be shown in the list
  const probe = new Audio();
  probe.preload = 'metadata';
  probe.src = song.url;
  probe.onloadedmetadata = () => { song.dur = probe.duration; renderMain(); };
  return song;
}
function addFiles(files) {
  for (const file of files) {
    if (!file.type.startsWith('audio/') && !/\.(mp3|m4a|aac|wav|flac|ogg|opus)$/i.test(file.name)) continue;
    const song = makeSong(nextId++, file.name.replace(/\.[^.]+$/, ''), file);
    songs.push(song);
    dbSave({ id: song.id, name: song.name, blob: file });   // keep the file for next time
    // if you're looking at a playlist, new songs go into it too
    const pl = playlists.find((p) => p.id === view);
    if (pl) pl.ids.push(song.id);
  }
  saveState();
  renderSide();
  renderMain();
}
// Wait until saved songs have loaded first, so new song ids never clash with saved ones
function importFiles(files) {
  const list = [...files];
  (ready || Promise.resolve()).then(() => addFiles(list));
}
$('files').onchange = (e) => { importFiles(e.target.files); e.target.value = ''; };

// drag files onto the page to import them
['dragenter', 'dragover'].forEach((ev) => window.addEventListener(ev, (e) => {
  if (dragFrom !== null) return;   // reordering the queue, not importing files
  e.preventDefault(); document.body.classList.add('dragging');
}));
window.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
window.addEventListener('drop', (e) => {
  if (dragFrom !== null) return;
  e.preventDefault(); document.body.classList.remove('dragging'); importFiles(e.dataTransfer.files);
});

// ---------- Playlists ----------
function openPlaylistDialog() {
  $('plName').value = '';
  $('modal').hidden = false;
  $('plName').focus();
}
function closePlaylistDialog() { $('modal').hidden = true; }
function createPlaylist() {
  const name = $('plName').value.trim();
  if (!name) { $('plName').focus(); return; }
  const pl = { id: nextId++, name, ids: [] };
  playlists.push(pl);
  saveState();
  view = pl.id;
  picking = null;
  $('viewSearch').value = '';
  closePlaylistDialog();
  renderSide();
  renderMain();
}
$('plCreate').onclick = createPlaylist;
$('plCancel').onclick = closePlaylistDialog;
$('plName').onkeydown = (e) => { if (e.key === 'Enter') createPlaylist(); };
$('modal').onkeydown = (e) => { if (e.key === 'Escape') closePlaylistDialog(); };
$('modal').onclick = (e) => { if (e.target === $('modal')) closePlaylistDialog(); };   // click outside the box

function deletePlaylist(id) {
  playlists = playlists.filter((p) => p.id !== id);
  if (playingFrom === id) playingFrom = null;
  saveState();
  view = 'library';
  picking = null;
  $('viewSearch').value = '';
  renderSide();
  renderMain();
}
function addToPlaylist(plId, songId) {
  const pl = playlists.find((p) => p.id === plId);
  if (!pl) return;
  if (pl.ids.includes(songId)) { toast('Already in ' + pl.name); return; }
  pl.ids.push(songId);
  saveState();
  renderSide();
  toast('Added to ' + pl.name);
}
function removeFromPlaylist(plId, songId) {
  const pl = playlists.find((p) => p.id === plId);
  if (pl) pl.ids = pl.ids.filter((x) => x !== songId);
  saveState();
  renderSide();
  renderMain();
}

// Delete a song from the library (and from playlists and the queue)
function deleteSong(id) {
  const song = byId(id);
  songs = songs.filter((s) => s.id !== id);
  playlists.forEach((p) => { p.ids = p.ids.filter((x) => x !== id); });
  for (let i = queue.length - 1; i >= 0; i--) if (queue[i] === id) removeFromQueue(i, true);
  if (song) URL.revokeObjectURL(song.url);
  dbRemove(id);                         // delete the saved copy too
  saveState();
  renderSide();
  renderMain();
}

// ---------- Queue editing ----------
// Put a song right after the one that's playing (or first, if nothing has started yet)
function addToQueue(id) {
  queue.splice(qpos + 1, 0, id);
  renderQueue();
  toast('Playing next');
}
// Stop everything and clear the player (used when the queue runs out)
function stopPlayback() {
  qpos = -1;
  playingFrom = null;
  currentGone = false;
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  updateProgress();
  setPlayIcon(false);
}
// If the playing song was removed from the queue, it gets dropped for real once it's done.
// Afterwards qpos points at the song before it, so "next" lands on the song that followed it.
function dropGoneCurrent() {
  if (!currentGone) return;
  currentGone = false;
  queue.splice(qpos, 1);
  qpos--;
}
function removeFromQueue(i, force) {
  if (i === qpos && !force) {         // the playing song: let it finish, but take it out of the queue
    currentGone = true;
    refresh();
    return;
  }
  const wasCurrent = i === qpos;
  if (wasCurrent) currentGone = false;
  queue.splice(i, 1);
  if (i < qpos) qpos--;
  if (wasCurrent) {
    if (!queue.length) {              // nothing left: stop
      stopPlayback();
    } else {                          // play whatever slid into this spot
      if (qpos >= queue.length) qpos = 0;
      playAt(qpos);
      return;
    }
  }
  refresh();
}
// Move the song at spot "from" into gap number "gap" (0 = before the first song, 1 = between the first and second, ...)
function moveQueueItem(from, gap) {
  const to = gap > from ? gap - 1 : gap;   // spot it ends up in once it's lifted out
  if (to === from) return;
  const cur = qpos;
  const [id] = queue.splice(from, 1);
  queue.splice(to, 0, id);
  // keep following the playing song
  if (cur === from) qpos = to;
  else if (from < cur && to >= cur) qpos = cur - 1;
  else if (from > cur && to <= cur) qpos = cur + 1;
  renderQueue();
}
function clearDropMarks() {
  $('queueList').querySelectorAll('.drop-before, .drop-after')
    .forEach((el) => el.classList.remove('drop-before', 'drop-after'));
}
$('queueList').ondragleave = (e) => {
  if (!$('queueList').contains(e.relatedTarget)) { clearDropMarks(); dropGap = null; }
};

// ---------- Rendering ----------
function refresh() { renderSide(); renderMain(); renderQueue(); renderNow(); }

function renderSide() {
  const nav = $('nav');
  nav.innerHTML = '';
  const item = (id, name, count) => {
    const b = document.createElement('button');
    b.className = 'navitem';
    b.setAttribute('aria-current', String(view === id));
    b.innerHTML = '<span class="name"></span><span class="count"></span>';
    b.children[0].textContent = name;
    b.children[1].textContent = count;
    if (id === playingFrom && currentSong()) {      // this is the list the music is coming from
      const eq = document.createElement('span');
      eq.className = 'eq';
      eq.innerHTML = '<i></i><i></i><i></i>';
      b.children[0].prepend(eq);
    }
    b.onclick = () => { view = id; picking = null; $('viewSearch').value = ''; renderSide(); renderMain(); };
    nav.appendChild(b);
  };
  item('library', 'Library', songs.length);
  const h = document.createElement('div');
  h.className = 'side-h';
  h.innerHTML = '<span>Playlists</span>';
  h.append(iconBtn('plus', 'New playlist', openPlaylistDialog));
  nav.appendChild(h);
  playlists.forEach((p) => item(p.id, p.name, p.ids.filter(byId).length));
}

// Round icon-only button for the banner; "primary" makes it the big white one
function heroBtn(icon, label, fn, primary) {
  const b = document.createElement('button');
  b.className = 'btn hbtn' + (primary ? ' primary big' : '');
  b.innerHTML = ICONS[icon];
  b.title = label;
  b.setAttribute('aria-label', label);
  b.onclick = fn;
  return b;
}

// ---------- "Add to playlist" popup: search + every library song with a + button ----------
function openPicker(plId) {
  const pl = playlists.find((p) => p.id === plId);
  if (!pl) return;
  picking = plId;
  $('pickTitle').textContent = 'Add to ' + pl.name;
  $('pickSearch').value = '';
  $('pickModal').hidden = false;
  renderPickList();
  $('pickSearch').focus();
}
function closePicker() {
  picking = null;
  $('pickModal').hidden = true;
}
function renderPickList() {
  const pl = playlists.find((p) => p.id === picking);
  if (!pl) return;
  const q = $('pickSearch').value.trim().toLowerCase();
  const matches = songs.filter((song) => song.name.toLowerCase().includes(q));
  const ul = $('pickList');
  ul.innerHTML = '';
  if (!matches.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = songs.length ? 'No songs match your search.' : 'Your library is empty dickwad. Add music';
    ul.appendChild(li);
    return;
  }
  matches.forEach((song) => {
    const added = pl.ids.includes(song.id);
    const li = document.createElement('li');
    li.className = 'row picker';

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = song.name;
    title.title = song.name;

    const dur = document.createElement('div');
    dur.className = 'dur';
    dur.textContent = fmt(song.dur);

    const btn = added
      ? iconBtn('check', 'Already in this playlist', () => {})
      : iconBtn('plus', 'Add to ' + pl.name, () => { addToPlaylist(pl.id, song.id); renderPickList(); renderMain(); });
    btn.disabled = added;

    li.append(title, dur, btn);
    ul.appendChild(li);
  });
}
$('pickSearch').oninput = renderPickList;
$('pickClose').onclick = closePicker;
$('pickModal').onkeydown = (e) => { if (e.key === 'Escape') closePicker(); };
$('pickModal').onclick = (e) => { if (e.target === $('pickModal')) closePicker(); };   // click outside the box

function renderMain() {
  const pl = playlists.find((p) => p.id === view);
  if (view !== 'library' && !pl) view = 'library';
  const all = viewIds();                // every song in this view
  const ids = displayIds();             // what's shown (searched + sorted); Play and clicking a song follow this
  const total = all.reduce((n, id) => n + (byId(id).dur || 0), 0);
  $('toolbar').hidden = !all.length;

  // Banner
  const hero = $('hero');
  hero.innerHTML = '';
  const h = document.createElement('h2');
  h.textContent = pl ? pl.name : 'Library';
  const info = document.createElement('p');
  info.textContent = (ids.length !== all.length ? ids.length + ' of ' : '') + all.length +
    (all.length === 1 ? ' song' : ' songs') + (total ? ', ' + fmt(total) : '');
  const actions = document.createElement('div');
  actions.className = 'actions';
  const play = heroBtn('play', 'Play', () => startQueue(ids, shuffle ? ids[Math.floor(Math.random() * ids.length)] : ids[0]), true);
  play.disabled = !ids.length;
  actions.append(play);
  if (pl) actions.append(heroBtn('plus', 'Add to playlist', () => openPicker(pl.id)));
  actions.append(heroBtn('upload', 'Add songs', () => $('files').click()));
  if (pl) actions.append(heroBtn('trash', 'Delete playlist', () => deletePlaylist(pl.id)));
  hero.append(h, info, actions);

  // Song list
  const list = $('list');
  list.innerHTML = '';
  if (!ids.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = all.length ? 'No songs match your search.' : pl
      ? 'The playlist is empty dipshit'
      : 'Drag and drop song files here';
    list.appendChild(li);
    return;
  }
  const cur = currentSong();
  ids.forEach((id, n) => {
    const song = byId(id);
    const isCur = !!cur && cur.id === id && view === playingFrom;   // only highlight in the list that's playing
    const li = document.createElement('li');
    li.className = 'row' + (isCur ? ' current' : '');
    li.onclick = () => startQueue(ids, id);

    const idx = document.createElement('div');
    idx.className = 'idx';
    if (isCur) idx.innerHTML = '<span class="eq"><i></i><i></i><i></i></span>';
    else idx.textContent = n + 1;

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = song.name;
    title.title = song.name;

    const dur = document.createElement('div');
    dur.className = 'dur';
    dur.textContent = fmt(song.dur);

    const ops = document.createElement('div');
    ops.className = 'ops';
    ops.append(iconBtn('addq', 'Play next', () => addToQueue(id)));
    if (pl) {
      ops.append(iconBtn('close', 'Remove from this playlist', () => removeFromPlaylist(pl.id, id)));
    } else {
      ops.append(iconBtn('trash', 'Delete from library', () => deleteSong(id)));
    }
    li.append(idx, title, dur, ops);
    list.appendChild(li);
  });
}

function renderQueue() {
  const now = currentSong();
  const first = qpos + 1;               // first "up next" spot in the queue (0 if nothing has started)

  // The playing song sits on its own card above everything else, so nothing can be dragged above it
  const nb = $('nowBlock');
  nb.innerHTML = '';
  if (now) {
    const card = document.createElement('div');
    card.className = 'nowcard';
    card.innerHTML = '<div class="q-h">Now playing</div>' +
      '<div class="nowrow"><span class="eq"><i></i><i></i><i></i></span><div class="title"></div></div>';
    const t = card.querySelector('.title');
    t.textContent = now.name;
    t.title = now.name;
    nb.appendChild(card);
  }

  const ul = $('queueList');
  ul.innerHTML = '';
  $('upHead').hidden = queue.length - first <= 0;
  if (!queue.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = 'Hit play on something';
    ul.appendChild(li);
    return;
  }
  for (let i = first; i < queue.length; i++) {
    const song = byId(queue[i]);
    if (!song) continue;
    const li = document.createElement('li');
    li.className = 'qrow';
    li.onclick = () => playAt(i);

    // drag and drop to reorder; a purple line shows where the song will land
    li.draggable = true;
    li.ondragstart = (e) => {
      dragFrom = i;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(i));
      li.classList.add('dragging');
    };
    li.ondragover = (e) => {
      if (dragFrom === null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const r = li.getBoundingClientRect();
      const before = e.clientY < r.top + r.height / 2;   // top half = drop above, bottom half = below
      dropGap = before ? i : i + 1;
      clearDropMarks();
      li.classList.add(before ? 'drop-before' : 'drop-after');
    };
    li.ondrop = (e) => {
      e.preventDefault();
      e.stopPropagation();
      const from = dragFrom, gap = dropGap;
      dragFrom = null; dropGap = null;
      if (from !== null && gap !== null) moveQueueItem(from, gap);
    };
    li.ondragend = () => {
      dragFrom = null; dropGap = null;
      clearDropMarks();
      li.classList.remove('dragging');
    };

    const idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = i - qpos;         // 1 = next up

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = song.name;
    title.title = song.name;

    const ops = document.createElement('div');
    ops.className = 'ops';
    ops.append(iconBtn('close', 'Remove from queue', () => removeFromQueue(i)));

    li.append(idx, title, ops);
    ul.appendChild(li);
  }

  // The queue loops, so songs that already played come around again after the last one.
  // (With shuffle on, the next round's order isn't decided yet, so nothing is shown.)
  if (qpos >= 0 && !shuffle) {
    for (let i = 0; i <= qpos; i++) {
      if (i === qpos && currentGone) continue;   // already removed; it just finishes playing
      const song = byId(queue[i]);
      if (!song) continue;
      const li = document.createElement('li');
      li.className = 'qrow';
      li.onclick = () => playAt(i);
      const idx = document.createElement('div');
      idx.className = 'idx';
      idx.textContent = (queue.length - first) + i + 1;   // keeps counting from the songs above
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = song.name;
      title.title = song.name;
      const ops = document.createElement('div');
      ops.className = 'ops';
      ops.append(iconBtn('close', 'Remove from queue', () => removeFromQueue(i)));
      li.append(idx, title, ops);
      ul.appendChild(li);
    }
  }
}

function renderNow() {
  const song = currentSong();
  $('now').textContent = song ? song.name : 'Nothing playing';
}

function renderAll() { refresh(); }

// ---------- Playback ----------
function playAt(p) {
  if (currentGone) {                    // the playing song was removed: drop it now that we're moving on
    const old = qpos;
    dropGoneCurrent();
    if (p > old) p--;                   // spots after it shifted up by one
    if (!queue.length) { stopPlayback(); refresh(); return; }
    if (p >= queue.length) p = 0;
  }
  const song = byId(queue[p]);
  if (!song) return;
  qpos = p;
  audio.src = song.url;
  audio.play().catch(() => {});
  refresh();
}

// Replace the queue with these songs and start at startId.
// With shuffle on, startId plays first and the rest are shuffled.
function startQueue(ids, startId, from = view) {
  if (!ids.length) return;
  playingFrom = from;
  currentGone = false;
  if (shuffle) {
    queue = [startId, ...shuffleArray(ids.filter((x) => x !== startId))];
    qpos = 0;
  } else {
    queue = [...ids];
    qpos = ids.indexOf(startId);
  }
  playAt(qpos);
}

function nextSong() {
  dropGoneCurrent();                    // a removed song ends here for good
  if (!queue.length) { stopPlayback(); refresh(); return; }
  let p = qpos + 1;
  if (p >= queue.length) {            // end of the queue: loop around
    if (shuffle && queue.length > 1) {
      const last = queue[qpos];
      shuffleArray(queue);
      if (queue[0] === last) [queue[0], queue[1]] = [queue[1], queue[0]];
    }
    p = 0;
  }
  playAt(p);
}

function prevSong() {
  if (!queue.length) return;
  if (qpos >= 0 && audio.currentTime > 5) { audio.currentTime = 0; return; }   // over 5 seconds in: restart this song
  const wasGone = currentGone;
  dropGoneCurrent();
  if (!queue.length) { stopPlayback(); refresh(); return; }
  // if the playing song was just dropped, qpos already points at the song before it
  if (wasGone) playAt(qpos < 0 ? queue.length - 1 : qpos);
  else playAt(qpos <= 0 ? queue.length - 1 : qpos - 1);
}

function setShuffle(on) {
  shuffle = on;
  $('shuffle').classList.toggle('on', on);
  $('shuffle').setAttribute('aria-pressed', on);
}

// Swap the play button between the play and pause icons
function setPlayIcon(playing) {
  const b = $('play');
  b.innerHTML = playing ? ICONS.pause : ICONS.play;
  b.title = playing ? 'Pause' : 'Play';
  b.setAttribute('aria-label', b.title);
  document.body.classList.toggle('is-playing', playing);
}

function togglePlay() {
  if (qpos === -1) {
    if (queue.length) { playAt(0); return; }
    let ids = displayIds();
    let from = view;
    if (!ids.length) { ids = songs.map((s) => s.id); from = 'library'; }
    if (ids.length) startQueue(ids, shuffle ? ids[Math.floor(Math.random() * ids.length)] : ids[0], from);
  } else if (audio.paused) audio.play();
  else audio.pause();
}
$('play').onclick = togglePlay;
$('next').onclick = nextSong;
$('prev').onclick = prevSong;

// Turning shuffle on shuffles the songs still coming up in the queue.
// Turning it off keeps the queue in whatever order it's in now.
$('shuffle').onclick = () => {
  setShuffle(!shuffle);
  saveState();
  if (shuffle) {
    const played = queue.slice(0, qpos + 1);
    queue = played.concat(shuffleArray(queue.slice(qpos + 1)));
    renderQueue();
  }
};

audio.onplay = () => setPlayIcon(true);
audio.onpause = () => setPlayIcon(false);
audio.onended = nextSong;             // auto-advance when a song finishes

// ---------- Queue panel open/close + keeping it above the bar ----------
const queuePanel = $('queue');
const bar = $('bar');
function fitQueue() {
  queuePanel.style.bottom = bar.offsetHeight + 'px';
  $('toast').style.bottom = (bar.offsetHeight + 14) + 'px';
}
fitQueue();
window.addEventListener('resize', fitQueue);
$('queueBtn').onclick = () => { fitQueue(); queuePanel.classList.toggle('open'); };
$('closeQueue').onclick = () => queuePanel.classList.remove('open');

// ---------- Volume + seek bar ----------
$('volume').oninput = (e) => { audio.volume = e.target.value / 100; saveState(); };
const timeText = (t) => fmt(t) || '0:00';
function updateProgress() {
  const d = audio.duration, t = audio.currentTime;
  const pct = d ? (t / d) * 100 : 0;
  seek.value = pct;
  // how much of the bar is purple (offset so it lines up with the 12px handle)
  seek.style.setProperty('--fill', 'calc(6px + (100% - 12px) * ' + (pct / 100) + ')');
  $('curTime').textContent = timeText(t);          // how far you are
  $('durTime').textContent = timeText(d);          // total length
}
audio.ontimeupdate = updateProgress;
audio.onloadedmetadata = updateProgress;
audio.onemptied = updateProgress;
seek.oninput = () => {
  if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
  updateProgress();
};

// Hovering the bar: show the time under the mouse and tint the stretch between "now" and the mouse
const seekTip = $('seekTip');
seek.onmousemove = (e) => {
  if (!audio.duration) return;
  const r = seek.getBoundingClientRect();
  const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
  const frac = Math.min(Math.max((x - 6) / (r.width - 12), 0), 1);   // 6px = half the handle
  seek.style.setProperty('--hover', 'calc(6px + (100% - 12px) * ' + frac + ')');
  seekTip.textContent = timeText(frac * audio.duration);
  seekTip.style.left = x + 'px';
  seekTip.classList.add('show');
};
seek.onmouseleave = () => {
  seek.style.removeProperty('--hover');
  seekTip.classList.remove('show');
};

// Search + sort
$('viewSearch').oninput = renderMain;
$('viewSort').onchange = renderMain;

// Spacebar plays/pauses from anywhere (except while typing in a text box or using a dropdown)
const isTyping = (el) => !!el && (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type === 'text'));
window.addEventListener('keydown', (e) => {
  if (e.code !== 'Space' || isTyping(e.target)) return;
  e.preventDefault();                   // no page scrolling, and a focused button isn't "clicked" too
  if (!e.repeat) togglePlay();
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' && !isTyping(e.target)) e.preventDefault();
});

renderAll();
ready = loadSaved();
</script>
</body>
</html>
